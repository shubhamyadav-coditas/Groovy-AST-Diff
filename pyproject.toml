[tool.poetry]
name = "groovy-ast-diff-api"
version = "0.1.0"
description = "FastAPI application for Groovy AST comparison with file upload endpoint, repository pattern and dependency injection"
authors = ["Developer <developer@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-multipart = "^0.0.6"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.25"}
greenlet = "^3.0.3"
alembic = "^1.13.1"
aiosqlite = "^0.19.0"
psycopg = {extras = ["binary", "pool"], version = "^3.1.18"}
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
aiofiles = "^23.2.1"
tree-sitter = "0.21.3"
setuptools = "*"

[tool.poetry.group.dev.dependencies]
# Linting
ruff = "^0.1.14"
mypy = "^1.8.0"
# Formatting
black = "^24.1.0"
isort = "^5.13.2"
# Code refactoring
autoflake = "^2.2.1"
# Testing
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
httpx = "^0.26.0"
requests = "^2.31.0"
# Type stubs
types-aiofiles = "^23.2.0"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.autoflake]
remove-all-unused-imports = true
remove-unused-variables = true
in-place = true
recursive = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"